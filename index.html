<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSB CALCULATOR Ver.3.1</title>
    <style>
        :root { --primary-color: #2563eb; --reset-color: #f1f5f9; --bg-color: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); padding: 20px; color: #1e293b; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 24px; max-width: 480px; margin: auto; }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
        .sub-title { text-align: center; font-size: 0.8rem; color: #64748b; margin-bottom: 24px; }
        section-label { display: block; font-weight: bold; margin-bottom: 12px; padding-left: 8px; border-left: 4px solid var(--primary-color); }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; color: #475569; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--primary-color); }
        .btn-row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 24px; }
        button { padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-calc { background: var(--primary-color); color: white; }
        .btn-reset { background: var(--reset-color); color: #475569; border: 1px solid #e2e8f0; }
        button:active { opacity: 0.7; }
        #result-area { margin-top: 24px; padding: 20px; border-radius: 12px; background: #eff6ff; display: none; border: 1px solid #dbeafe; }
        .score-label { text-align: center; font-size: 0.85rem; font-weight: bold; color: #1e40af; }
        .score-val { font-size: 2.8rem; font-weight: 800; color: var(--primary-color); text-align: center; margin: 4px 0; }
        #rank-out { text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 1.2rem; }
        .detail-box { font-size: 0.8rem; border-top: 1px solid #dbeafe; margin-top: 12px; padding-top: 12px; color: #1e40af; line-height: 1.5; }
        .point-guide { font-size: 0.7rem; color: #64748b; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>OSB CALCULATOR v3.1</h2>
    <div class="sub-title">打撃貢献度判定：整数入力対応版</div>

    <section-label>全体指標 (OBP / SLG)</section-label>
    <div class="input-group">
        <div><label>全体出塁率 (例: 350)</label><input type="number" id="obp" step="any" placeholder="350"></div>
        <div><label>全体長打率 (例: 450)</label><input type="number" id="slg" step="any" placeholder="450"></div>
    </div>

    <section-label>得点圏詳細 (RPC算出用)</section-label>
    <div class="input-group">
        <div class="full-width"><label>得点圏打席数 (PA)</label><input type="number" id="r_pa" placeholder="0"></div>
        <div><label>安打</label><input type="number" id="r_h" placeholder="0"></div>
        <div><label>四死球</label><input type="number" id="r_bb" placeholder="0"></div>
        <div><label>打点</label><input type="number" id="r_rbi" placeholder="0"></div>
        <div><label>犠飛</label><input type="number" id="r_sf" placeholder="0"></div>
        <div class="full-width"><label>犠打 (送りバント)</label><input type="number" id="r_sh" placeholder="0"></div>
    </div>

    <div class="btn-row">
        <button class="btn-calc" onclick="calculate()">計算を実行</button>
        <button class="btn-reset" onclick="resetForm()">リセット</button>
    </div>

    <div id="result-area">
        <div class="score-label">OSBC SCORE</div>
        <div class="score-val" id="score-out">-</div>
        <div id="rank-out"></div>
        <div class="detail-box" id="detail-out"></div>
    </div>
</div>

<script>
// 小数点補正関数
function normalize(val) {
    let num = parseFloat(val) || 0;
    // 1以上（例: 350）なら1000で割る。ただし長打率が1.000を超える場合も考慮し、10以上なら割る設定。
    return num >= 10 ? num / 1000 : num;
}

function calculate() {
    // 整数入力を正規化
    const obp = normalize(document.getElementById('obp').value);
    const slg = normalize(document.getElementById('slg').value);
    
    const pa = parseFloat(document.getElementById('r_pa').value) || 0;
    const h = parseFloat(document.getElementById('r_h').value) || 0;
    const bb = parseFloat(document.getElementById('r_bb').value) || 0;
    const rbi = parseFloat(document.getElementById('r_rbi').value) || 0;
    const sh = parseFloat(document.getElementById('r_sh').value) || 0;
    const sf = parseFloat(document.getElementById('r_sf').value) || 0;

    if (pa === 0) {
        alert("得点圏での打席数を入力してください");
        return;
    }

    // RPCロジック
    const rpc_num = ((h + bb) * 1.5) + rbi + ((sh + sf) * 0.5);
    const rpc = rpc_num / pa;

    // OSBC 最終指数 (1.5 : 1.0 : 0.5)
    const finalScore = (obp * 1.5) + (slg * 1.0) + (rpc * 0.5);

    // 表示処理
    const resArea = document.getElementById('result-area');
    resArea.style.display = 'block';
    document.getElementById('score-out').innerText = finalScore.toFixed(3);
    
    // ランク判定
    let rank = "E";
    let color = "#94a3b8";
    if (finalScore >= 1.85) { rank = "SSS"; color = "#f59e0b"; }
    else if (finalScore >= 1.70) { rank = "SS"; color = "#fbbf24"; }
    else if (finalScore >= 1.55) { rank = "S"; color = "#fcd34d"; }
    else if (finalScore >= 1.40) { rank = "A"; color = "#10b981"; }
    else if (finalScore >= 1.25) { rank = "B"; color = "#3b82f6"; }
    else if (finalScore >= 1.10) { rank = "C"; color = "#6366f1"; }
    else if (finalScore >= 0.95) { rank = "D"; color = "#64748b"; }

    const rankOut = document.getElementById('rank-out');
    rankOut.innerText = `Rank: ${rank}`;
    rankOut.style.color = color;

    document.getElementById('detail-out').innerHTML = `
        正規化後出塁率: ${obp.toFixed(3)} (×1.5)<br>
        正規化後長打率: ${slg.toFixed(3)} (×1.0)<br>
        得点圏貢献度: ${rpc.toFixed(3)} (×0.5)
    `;
}

function resetForm() {
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => input.value = '');
    document.getElementById('result-area').style.display = 'none';
}
</script>
</body>
</html>
